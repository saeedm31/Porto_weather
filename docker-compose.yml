# One-command setup on any server with Docker:
#   cp .env.example .env    # set DB_PASS, and the city if you want another one
#   docker compose up -d --build
# Then open http://<server-ip>:5000. The first start downloads the history (about a minute).

x-app-env: &app-env
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: postgres
  DB_USER: postgres
  DB_PASS: ${DB_PASS:-change_me}
  CITY_NAME: ${CITY_NAME:-Porto}
  CITY_LAT: ${CITY_LAT:-41.15}
  CITY_LON: ${CITY_LON:--8.61}
  TIMEZONE: ${TIMEZONE:-Europe/Lisbon}
  BACKFILL_START: ${BACKFILL_START:-1991-01-01}
  WEATHER_TABLE: ${WEATHER_TABLE:-porto_weather}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASS:-change_me}
    volumes:
      - weather-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Creates the table, backfills the history, then updates once a day.
  updater:
    build: .
    environment: *app-env
    command: sh -c "python setup_db.py && while true; do python fetch_weather.py; sleep 86400; done"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: .
    environment: *app-env
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  weather-data:
